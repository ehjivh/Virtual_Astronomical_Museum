<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Astronomical Museum | 仮想天文博物館</title>
    <link rel="stylesheet" href="style.css" />
    <script src="common-ui.js" defer></script>
    <meta name="description" content="バーチャル天文博物館で、光と波・望遠鏡のしくみ・宇宙のスケールをインタラクティブに探求しましょう。" />
  </head>
  <body>
    <div class="page-container">
      <!-- Nav: N5 Floating Pill -->
      <nav class="nav-pill" aria-label="Main Navigation" style="max-width: 720px; margin-top: var(--space-md)">
        <div class="nav-pill__wordmark">Virtual Astronomical Museum</div>
        <div class="nav-pill__actions">
          <a href="#zone-light" class="nav-pill__btn">Zone 1 · 光と波</a>
          <a href="#zone-telescope" class="nav-pill__btn">Zone 2 · 望遠鏡</a>
          <a href="#zone-cosmos" class="nav-pill__btn">Zone 3 · 宇宙</a>
        </div>
      </nav>

      <!-- Portfolio Grid Header -->
      <header class="portfolio-header" id="exhibits">
        <div class="portfolio-header__tagline">Interactive Astronomy Museum · 3 Zones · 12 Exhibits</div>
        <h1 class="portfolio-header__title">宇宙を、紐解く。</h1>
        <p class="section-lead" style="margin-left: auto; margin-right: auto">
          各展示のミッションをクリアして「展示スタンプ」を集めよう。3つの学習ゾーンを巡り、物理法則と天文学の観測技術を自分の手で体験できます。
        </p>
      </header>

      <!-- スタンプ帳ダッシュボード（common-ui.js により動的描画） -->
      <section id="vam-dashboard" class="vam-dashboard" aria-label="スタンプ帳ダッシュボード"></section>

      <!-- ゾーン別展示カードグリッド（common-ui.js により VAM_CATALOG から動的描画） -->
      <main id="vam-zones"></main>

      <!-- Footer: Ft5 Statement -->
      <footer class="footer-statement">
        <div class="footer-statement__text">暗闇の先にある、あなただけの宇宙。</div>
        <div class="footer-statement__meta">
          <span>Virtual Astronomical Museum（仮想天文博物館）</span>
          <span data-vam="stamp-count">0 / 12 Stamps</span>
        </div>
      </footer>
    </div>
  </body>
</html>
